<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Royalty Free Word Search Generator</title>
    <!-- Link to the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Royalty Free Word Search Generator</h1>
</header>
<main>
    <section id="controls">
        <!-- Word search grid size inputs -->
        <div class="control-group">
            <label for="rows">Rows:</label>
            <input type="number" id="rows" min="5" max="50" value="10">
        </div>
        <div class="control-group">
            <label for="cols">Columns:</label>
            <input type="number" id="cols" min="5" max="50" value="10">
        </div>
        <!-- Textarea for list of words -->
        <div class="control-group">
            <label for="words">Enter words (one per line):</label>
            <textarea id="words" rows="6" placeholder="apple&#10;banana&#10;cherry"></textarea>
        </div>
        <!-- Option for spaces between letters -->
        <div class="control-group">
            <label for="spaces">Insert spaces between letters:</label>
            <input type="checkbox" id="spaces" checked>
        </div>
        <!-- Dark mode toggle -->
        <div class="control-group">
            <label for="darkMode">Dark Mode:</label>
            <input type="checkbox" id="darkMode">
        </div>
        <!-- Generate and Copy buttons -->
        <div class="control-group buttons">
            <button id="generateBtn">Generate Word Search</button>
            <button id="copyBtn">Copy Grid</button>
        </div>
    </section>

    <!-- Output areas for the grid -->
    <section id="outputs">
        <h2>Word Search Grid</h2>
        <pre id="gridOutput" class="monospaced"></pre>
        <h2>Word Search with Words Revealed</h2>
        <pre id="revealedOutput" class="monospaced"></pre>
    </section>
</main>
<!-- Link to the JS file -->
<script src="script.js"></script>
</body>
</html>
