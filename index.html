<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Royalty Free Word Search Generator</title>
    <!-- Link to the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Royalty Free Word Search Generator</h1>
    <h3>CC0 License</h3>
</header>
<main>
    <section id="controls">
        <!-- Grid dimensions -->
        <div class="control-group">
            <label for="rows">Rows:</label>
            <input type="number" id="rows" min="5" max="50" value="10">
        </div>
        <div class="control-group">
            <label for="cols">Columns:</label>
            <input type="number" id="cols" min="5" max="50" value="10">
        </div>
        <!-- Word list input -->
        <div class="control-group">
            <label for="words">Enter words (one per line):</label>
            <textarea id="words" rows="6" placeholder="apple&#10;banana&#10;cherry"></textarea>
        </div>
        <!-- Options section -->
        <section id="options">
            <h3>Options</h3>
            <div class="control-group">
                <label for="darkMode">Dark Mode:</label>
                <input type="checkbox" id="darkMode">
            </div>
            <div class="control-group">
                <label for="spaces">Show spaces between letters:</label>
                <input type="checkbox" id="spaces" checked>
            </div>
            <div class="control-group">
                <label for="allowDiagonals">Allow diagonals:</label>
                <input type="checkbox" id="allowDiagonals" checked>
            </div>
            <div class="control-group">
                <label for="allowReverse">Allow reverse words (right-to-left):</label>
                <input type="checkbox" id="allowReverse" checked>
            </div>
        </section>
        <!-- Generate button -->
        <div class="control-group buttons">
            <button id="generateBtn" disabled>Generate Word Search</button>
        </div>
        <!-- Warning messages -->
        <div id="warnings" class="warning"></div>
    </section>

    <!-- Output areas for the grid -->
    <section id="outputs">
        <h2>Word Search Puzzle</h2>
        <pre id="gridOutput" class="monospaced"></pre>
        <h2>Word Search with Answers</h2>
        <pre id="revealedOutput" class="monospaced"></pre>
    </section>
</main>
<!-- Link to the JS file -->
<script src="script.js"></script>
</body>
</html>
